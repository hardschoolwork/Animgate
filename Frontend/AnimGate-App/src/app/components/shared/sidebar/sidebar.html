<aside class="sidebar">
  <div class="logo-area">
    <span class="logo-anim">ANIM</span>
    <span class="logo-gate">GATE</span>
  </div>

  <div class="nav-section">
    <div class="nav-label">Navigation</div>
    @for (item of navItems; track item.id) {
      <a class="nav-link"
         [class.active]="nav.activeTab() === item.id"
         (click)="nav.setTab(item.id)">
        <i class="fas" [class]="item.icon"></i> {{ item.label }}
      </a>
    }
  </div>

  <div class="nav-section">
    <div class="nav-label">Ma liste</div>
    <a class="nav-link"><i class="far fa-heart"></i> Favoris</a>
    <a class="nav-link"><i class="fas fa-history"></i> Continuer <span class="badge-count">3</span></a>
    <a class="nav-link"><i class="far fa-bookmark"></i> À regarder</a>
  </div>

  <div class="nav-section">
    <div class="nav-label">Paramètres</div>
    <a class="nav-link"><i class="far fa-star"></i> Recommandations</a>
    <a class="nav-link"><i class="fas fa-cog"></i> Paramètres</a>
  </div>

  <a class="nav-link logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>

  <div class="user-card">
    <div class="avatar">AK</div>
    <div class="user-info">
      <span class="user-name">Arnaud K.</span>
      <span class="user-role">Membre</span>
    </div>
  </div>
</aside>
<div class="sidebar-overlay" [class.active]="nav.isSidebarOpen()" (click)="nav.closeSidebar()"></div>
