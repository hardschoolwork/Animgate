<div class="auth-container">
  <div class="auth-box">
    <div class="logo-header">ANIM<span>GATE</span></div>
    <h2>Créer un compte</h2>
    <p class="subtitle">Rejoins la communauté AnimGate</p>

    @if (error) {
      <div class="alert-error">{{ error }}</div>
    }

    <form (ngSubmit)="onRegister()" class="auth-form">
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" [(ngModel)]="username" name="username" required placeholder="ton_username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="ton@email.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-red btn-full" [disabled]="loading">
        @if (loading) { <i class='bx bx-loader-alt bx-spin'></i> Inscription... }
        @else { <i class='bx bx-user-plus'></i> S'inscrire }
      </button>
    </form>

    <div class="auth-footer">
      Déjà un compte ? <a routerLink="/login" class="link-accent">Se connecter</a>
    </div>
    <div class="auth-footer">
      <a routerLink="/landing" class="link-muted"><i class='bx bx-arrow-back'></i> Retour à l'accueil</a>
    </div>
  </div>
</div>
